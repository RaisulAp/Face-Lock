name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/faceclock-api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/faceclock-api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: apps/faceclock-api

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/faceclock-api/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/faceclock-api
          version: latest

      - name: go test -race
        run: go test -race ./...
