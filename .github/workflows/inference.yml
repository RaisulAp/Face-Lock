name: inference

on:
  push:
    branches: [main]
    paths:
      - "services/faceclock-inference/**"
      - ".github/workflows/inference.yml"
  pull_request:
    paths:
      - "services/faceclock-inference/**"
      - ".github/workflows/inference.yml"

defaults:
  run:
    working-directory: services/faceclock-inference

jobs:
  ruff-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
