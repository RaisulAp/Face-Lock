# Dev-only convenience layer. NOT applied by `make up` (which pins
# `-f deploy/docker-compose.yml` explicitly — Compose only auto-merges an
# override file when no -f flag is given at all). Apply it deliberately:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up -d --build
#
# What it adds:
#   1. Hot-reload bind-mounts for faceclock-web (source edits without a
#      rebuild — the base compose file bakes in a source snapshot instead).
#   2. "Hybrid Development" mode (see deploy/HYBRID_DEV.md):
#        - `faceclock-inference` and `faceclock-api`/`faceclock-web` get a
#          Compose `profiles` tag, so a bare
#              docker compose -f ... -f ... up -d
#          (no service name, no --profile) starts ONLY postgres. This is
#          the default because postgres is the one service that genuinely
#          needs to be containerized (pgvector).
#        - `faceclock-api`/`faceclock-web` are meant to run on the host
#          instead (`go run ./cmd/api`, `npm run dev`) — they are ~free in
#          RAM there. Their `docker-app` profile only exists as a fallback
#          for "I don't want to run them on the host right now"; naming a
#          profiled service explicitly (`up faceclock-api`) or passing
#          `--profile docker-app` starts it same as before.
#        - `faceclock-inference` (Python + ONNX, the heaviest container)
#          gets its own `ai` profile so it can be started/stopped on demand
#          with `make ai-up` / `make ai-down`, independent of everything
#          else. Its port is published to the host (8000) so a
#          host-run faceclock-api can reach it at localhost:8000.
#      NOTE: Compose refuses to start a service whose `depends_on` target is
#      excluded by profiles (`docker-app` alone => error, not an implicit
#      pull-in) — the "just run everything in Docker like before" fallback
#      needs BOTH profiles active at once:
#        docker compose ... --profile ai --profile docker-app up -d --build
#   3. Memory ceilings on the two containers most likely to be left running
#      unattended (postgres, faceclock-inference), so a leak or an
#      oversized ONNX session takes down that container instead of eating
#      the whole WSL2 VM (`vmmem`) and dragging the host down with it.
#      These are dev-only guardrails, not production sizing — re-measure
#      before reusing them anywhere else.

services:
  postgres:
    mem_limit: 512m

  faceclock-inference:
    profiles: ["ai"]
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    mem_limit: 1.5g
    volumes:
      - ../services/faceclock-inference/app:/app/app

  faceclock-api:
    profiles: ["docker-app"]

  faceclock-web:
    profiles: ["docker-app"]
    volumes:
      - ../apps/faceclock-web/src:/app/src
      - ../apps/faceclock-web/index.html:/app/index.html
      - ../apps/faceclock-web/vite.config.ts:/app/vite.config.ts
