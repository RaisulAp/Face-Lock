name: faceclock

networks:
  faceclock-internal:
    driver: bridge

volumes:
  faceclock-pgdata:
  faceclock-uploads:

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceclock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-faceclock}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - faceclock-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faceclock} -d ${POSTGRES_DB:-faceclock}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - faceclock-internal

  faceclock-inference:
    build:
      context: ../services/faceclock-inference
    environment:
      FACE_ENGINE_TOKEN: ${FACE_ENGINE_TOKEN:-}
      TZ: UTC
    # Sengaja TANPA `ports:` — hanya faceclock-api yang boleh menghubungi
    # service ini, lewat network internal compose (Fase 0 § 2.9).
    expose:
      - "8000"
    networks:
      - faceclock-internal

  faceclock-api:
    build:
      context: ../apps/faceclock-api
      args:
        VERSION: ${VERSION:-0.1.0}
        COMMIT: ${COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER:-faceclock}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-faceclock}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/data/uploads}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      INFERENCE_BASE_URL: http://faceclock-inference:8000
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:-}
      INFERENCE_TIMEOUT_MS: ${INFERENCE_TIMEOUT_MS:-6000}
      JWT_SECRET: ${JWT_SECRET:-}
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - faceclock-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      faceclock-inference:
        condition: service_started
    networks:
      - faceclock-internal

  faceclock-web:
    build:
      context: ../apps/faceclock-web
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    depends_on:
      - faceclock-api
    networks:
      - faceclock-internal
    # The `dev` build stage runs the Vite dev server, which has no built-in
    # HEALTHCHECK (unlike the `prod`/nginx stage) — defined here instead so
    # `docker compose ps` can still report this service healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
